<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0b5" />
      <stop offset="100%" stop-color="#e2b192" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#312e81" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Body / Shoulders -->
  <path d="M40 180 C40 145, 65 135, 100 135 C135 135, 160 145, 160 180 Z" fill="url(#primaryGrad)" />
  <!-- Shirt collar -->
  <polygon points="100,150 85,135 115,135" fill="#4338ca" />
  <polygon points="100,155 90,135 110,135" fill="#e0e7ff" />

  <!-- Neck -->
  <rect x="90" y="115" width="20" height="25" rx="5" fill="url(#skinGrad)" />

  <!-- Head -->
  <ellipse cx="100" cy="90" rx="32" ry="38" fill="url(#skinGrad)" />

  <!-- Hair -->
  <path d="M68 85 C68 55, 80 48, 100 48 C120 48, 132 55, 132 85 C124 75, 115 72, 100 72 C85 72, 76 75, 68 85 Z" fill="#1e293b" />

  <!-- Glasses -->
  <rect x="76" y="82" width="18" height="12" rx="3" fill="none" stroke="#0ea5e9" stroke-width="2" />
  <rect x="106" y="82" width="18" height="12" rx="3" fill="none" stroke="#0ea5e9" stroke-width="2" />
  <line x1="94" y1="88" x2="106" y2="88" stroke="#0ea5e9" stroke-width="2" />

  <!-- Smile -->
  <path d="M92 110 Q100 116 108 110" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round" />

  <!-- Glowing tech badge -->
  <circle cx="150" cy="50" r="16" fill="#0f172a" stroke="#6366f1" stroke-width="2" />
  <text x="150" y="55" font-size="11" font-family="monospace" font-weight="bold" fill="#38bdf8" text-anchor="middle">&lt;/&gt;</text>
</svg>