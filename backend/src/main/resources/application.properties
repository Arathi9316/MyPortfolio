# ===================================================================
# Spring Boot Portfolio Application Configuration
# Ashish Rathi - Full-Stack Developer Portfolio
# ===================================================================

spring.application.name=portfolio-backend
server.port=8080

# -------------------------------------------------------------------
# MySQL Database Configuration (Supports Local & Cloud Env Variables)
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/portfolio_db1?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12369}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# JPA / Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Data initialization is safely handled by DataInitializer.java via JPA on application startup.
# We set sql.init.mode to never so raw scripts don't conflict with existing tables.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# -------------------------------------------------------------------
# Email Configuration (JavaMail / SMTP & Cloud Deployment Ready)
# -------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
portfolio.contact.recipient-email=${CONTACT_RECIPIENT_EMAIL:rathiashish7079@gmail.com}

# -------------------------------------------------------------------
# CORS & Web Settings
# -------------------------------------------------------------------
portfolio.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
